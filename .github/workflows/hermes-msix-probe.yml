name: Probe official Hermes MSIX host
on:
  push:
    branches: [investigate/hermes-msix-5028]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 9ea44f1bccd26440eb20638a7d9cbdd502a44caa
          path: rtk-final
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build exact final RTK fix for original x64 architecture
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: cargo build --locked --manifest-path rtk-final/Cargo.toml --no-default-features --target x86_64-pc-windows-msvc
      - name: Build read-only native PATH probe
        run: cargo build --manifest-path .diagnostics/5028/probe/Cargo.toml
      - name: Inspect disposable runner capabilities
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber,ProductType | Format-List
          "SessionId=$((Get-Process -Id $PID).SessionId) UserInteractive=$([Environment]::UserInteractive)"
          query session
          Get-Command Add-AppxPackage,Get-AppxPackage,winget -ErrorAction SilentlyContinue | Select-Object Name,Source | Format-Table
          Get-Service AppXSvc,ClipSVC -ErrorAction SilentlyContinue | Select-Object Name,Status,StartType | Format-Table
          Get-AppxPackage | Where-Object Name -Match 'DesktopAppInstaller|WindowsStore|Hermes' | Select-Object Name,Version,PackageFullName | Format-Table
          $global:LASTEXITCODE = 0
      - name: Check official package feeds without changing trust or accounts
        shell: pwsh
        run: |
          foreach ($channel in 'stable','canary') {
            $url = "https://hermes-assets.nousresearch.com/releases/win32/$channel/$channel.appinstaller"
            try { $response = Invoke-WebRequest $url; "URL=$url HTTP=$($response.StatusCode)"; [Text.Encoding]::UTF8.GetString($response.Content) }
            catch { "URL=$url ERROR=$($_.Exception.Message)" }
          }
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget --version
            winget show --id 9PMXK8CZC7KR --source msstore --disable-interactivity
            "winget-show-exit=$LASTEXITCODE"
          }
          $global:LASTEXITCODE = 0
      - name: Verify and install official signed stable MSIX on disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $feed = 'https://hermes-assets.nousresearch.com/releases/win32/stable/stable.appinstaller'
          $descriptor = Join-Path $env:RUNNER_TEMP 'hermes.appinstaller'
          Invoke-WebRequest $feed -OutFile $descriptor
          [xml]$xml = Get-Content $descriptor -Raw
          $bundle = $xml.AppInstaller.MainBundle
          if ($bundle.Name -ne 'NousResearch.HermesBundled' -or $bundle.Publisher -ne 'CN=Nous Research Inc., O=Nous Research Inc., L=Austin, S=Texas, C=US') { throw 'Unexpected official feed identity' }
          if (([uri]$bundle.Uri).Host -ne 'hermes-assets.nousresearch.com' -or ([uri]$bundle.Uri).Scheme -ne 'https') { throw 'Unexpected artifact origin' }
          $file = Join-Path $env:RUNNER_TEMP 'hermes.msix'
          $artifactUri = 'https://hermes-assets.nousresearch.com/releases/tag/rc.3-v0.22.0/HermesBundled-0.22.0-win-x64.msix'
          # Official handoff-win32-x64.json binds this file to e06df9c2eae6901f4c88f464e0ae6e753c0428b8.
          $expectedHash = 'ADD268E6D6A02F7A4510E040B7513CD1C8DD4E5FF24AF4E90462D962599C847C'
          "DOWNLOADING $artifactUri at $(Get-Date -Format o)"
          curl.exe --fail --location --retry 2 --max-time 1000 --output $file $artifactUri
          if ($LASTEXITCODE) { throw "Official package download failed: $LASTEXITCODE" }
          "DOWNLOADED $((Get-Item $file).Length) bytes at $(Get-Date -Format o)"
          $hash = Get-FileHash $file -Algorithm SHA256
          $hash | Format-List
          if ($hash.Hash -ne $expectedHash) { throw "Official receipt hash mismatch" }
          $signature = Get-AuthenticodeSignature $file
          $signature | Select-Object Status,StatusMessage,SignerCertificate | Format-List
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -ne $bundle.Publisher) { throw 'Not a trusted matching publisher signature' }
          try {
            "INSTALLING at $(Get-Date -Format o)"
            $deployment = Start-Job -ArgumentList $file -ScriptBlock { param($path) Add-AppxPackage -Path $path -ErrorAction Stop }
            $deadline = (Get-Date).AddMinutes(20)
            while ($deployment.State -eq 'Running' -and (Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 30
              "DEPLOYMENT state=$($deployment.State) at $(Get-Date -Format o)"
              Get-WinEvent -LogName 'Microsoft-Windows-AppXDeploymentServer/Operational' -MaxEvents 3 -ErrorAction SilentlyContinue | Select-Object TimeCreated,Id,Message | Format-List
            }
            if ($deployment.State -eq 'Running') { throw 'Deployment did not finish within 20 minutes; no trust/security changes attempted' }
            Receive-Job $deployment -ErrorAction Stop
            if ($deployment.State -ne 'Completed') { throw "Deployment job failed: $($deployment.State)" }
            $pkg = Get-AppxPackage -Name $bundle.Name
            $pkg | Select-Object Name,Version,PackageFullName,PackageFamilyName,InstallLocation | Format-List
            "HERMES_INSTALL=$($pkg.InstallLocation)" >> $env:GITHUB_ENV
            $manifest = Get-AppxPackageManifest -Package $pkg.PackageFullName
            $manifest.Package.Dependencies | Format-List
            $app = @($manifest.Package.Applications.Application)[0]
            "APP_ID=$($app.Id) EXECUTABLE=$($app.Executable)"
            Start-Process explorer.exe -ArgumentList "shell:AppsFolder\$($pkg.PackageFamilyName)!$($app.Id)"
            Start-Sleep -Seconds 20
            Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -like "$($pkg.InstallLocation)*" } | Select-Object Name,ProcessId,ParentProcessId,ExecutablePath,CommandLine | Format-List
          } catch {
            "INSTALL_OR_ACTIVATION_FAILED: $($_ | Out-String)"
            throw
          }
      - name: Compare RTK against actual installed MSIX git candidates
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RTK_TELEMETRY_DISABLED: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:HERMES_INSTALL 'app/resources/agent-payload'
          $stamp = Get-Content (Join-Path $env:HERMES_INSTALL 'app/resources/install-stamp.json') -Raw | ConvertFrom-Json
          $stamp | ConvertTo-Json -Depth 8
          $python = Join-Path $root $stamp.runtime.storePython
          $source = Join-Path $root $stamp.runtime.repoDir
          $deps = Join-Path $root $stamp.runtime.sitePackages
          $repo = Join-Path $env:RUNNER_TEMP 'rtk-hermes-command-repo'
          git init -q $repo
          if ($LASTEXITCODE) { throw 'Fixture git init failed' }
          $release = gh api repos/rtk-ai/rtk/releases/tags/v1.1.0 | ConvertFrom-Json
          $asset = $release.assets | Where-Object name -EQ 'rtk-x86_64-pc-windows-msvc.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'rtk-original.zip'
          Invoke-WebRequest $asset.browser_download_url -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($asset.digest -ne "sha256:$hash") { throw 'Original RTK release digest mismatch' }
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP 'rtk-original')
          $original = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'rtk-original') -Recurse -Filter rtk.exe).FullName
          $fixed = (Resolve-Path 'rtk-final/target/x86_64-pc-windows-msvc/debug/rtk.exe').Path
          $plainPath = $env:PATH
          $probe = (Resolve-Path '.diagnostics/5028/probe/target/debug/path-5028-probe.exe').Path
          $gitRoots = @(Get-ChildItem (Join-Path $root 'tools') -Directory | Where-Object Name -Match '^git-')
          $candidates = @($gitRoots | ForEach-Object { Get-ChildItem $_.FullName -Filter git.exe -Recurse -File } | Sort-Object FullName)
          if (-not $candidates.Count) { throw 'No actual packaged Git executable found; no substitute fixture will be used' }
          "ACTUAL_PACKAGED_GIT_CANDIDATES"
          $candidates | Select-Object FullName,Length | Format-Table -Wrap
          $package = Get-AppxPackage -Name NousResearch.HermesBundled
          $manifest = Get-AppxPackageManifest -Package $package.PackageFullName
          "REGISTERED_APPLICATION_EXTENSIONS"
          $manifest.Package.Applications.OuterXml
          Get-Command Invoke-CommandInDesktopPackage -ErrorAction SilentlyContinue | Select-Object Name,Source | Format-Table
          Set-Location $repo
          foreach ($rtk in @($original,$fixed)) {
            & $rtk --version
            & $rtk git status 2>&1 | ForEach-Object { "PLAIN_RESULT $_" }
            "PLAIN_EXIT=$LASTEXITCODE RTK=$rtk"
          }
          foreach ($candidate in $candidates) {
            "ACTUAL_CANDIDATE=$($candidate.FullName)"
            try { Get-Acl -LiteralPath $candidate.FullName | Select-Object Owner,AccessToString | Format-List }
            catch { "ACL_READ_DENIED_OR_UNAVAILABLE: $($_.Exception.Message)" }
            foreach ($order in @('first','last')) {
              $dir = $candidate.DirectoryName
              $env:PATH = if ($order -eq 'first') { "$dir;$plainPath" } else { "$plainPath;$dir" }
              "ACTUAL_MSIX_ORDER=$order DIRECTORY=$dir"
              & $probe $dir
              foreach ($rtk in @($original,$fixed)) {
                & $rtk git status 2>&1 | ForEach-Object { "MSIX_RESULT $_" }
                "MSIX_EXIT=$LASTEXITCODE RTK=$rtk ORDER=$order CANDIDATE=$($candidate.FullName)"
              }
            }
          }
          $env:PATH = $plainPath
          $global:LASTEXITCODE = 0
